const searchBox = document.getElementById("search");
const resultsDiv = document.getElementById("results");
const countDiv = document.getElementById("count");

function renderResults(items) {

    countDiv.textContent = `${items.length} risultati trovati`;

    resultsDiv.innerHTML = items.map(item => `
        <div class="result">
            <div class="question">${item.id}. ${item.question}</div>
            <div class="answer">
                <strong>Risposta:</strong> ${item.answer}
            </div>
        </div>
    `).join('');

}

renderResults(questionsData.questions);

searchBox.addEventListener("input", () => {

    const keyword = searchBox.value.toLowerCase().trim();

    const filtered = questionsData.questions.filter(q =>
        q.question.toLowerCase().includes(keyword)
    );

    renderResults(filtered);

});
